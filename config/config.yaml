# =====================================================================
# Trading & Research Command Center — main configuration
# ---------------------------------------------------------------------
# Hard rule (CLAUDE.md §3): the trading universe, holdings, account size
# and every risk limit live HERE, not in code. Edit freely.
#
# NOTE: the project brief (`trading_command_center_brief.md`) was not
# present in the repo when this file was generated, so the universe and
# holdings below are SENSIBLE PLACEHOLDERS, not the real §4 list.
# Replace them with your actual watchlist/holdings.
#
# Environment variables can override selected values at runtime — see
# `worker/app/config.py` (e.g. APP_UNIVERSE, APP_ACCOUNT_SIZE).
# =====================================================================

base_currency: USD

# --- Account ---------------------------------------------------------
account:
  # Total account size in base_currency. Used by the (Phase 3) risk/sizing math.
  size: 100000
  broker_default: "Directa"

# --- Risk limits (M6 — configurable; the cockpit is read-only, these are
# limits for the sizing calculator and breach FLAGS, never order rules) ---
risk:
  # Max % of account risked on a single position (entry -> stop).
  max_risk_per_trade_pct: 1.0
  # Max portfolio "heat" = sum of open risk across all open positions (% of account).
  max_portfolio_heat_pct: 6.0
  # Max number of concurrent open positions.
  max_concurrent_positions: 8
  # Hard cap on how far out a position deadline may be set (business rule).
  max_position_deadline_days: 21
  # Warn when a position's deadline is within this many days.
  deadline_warn_days: 3
  # Default ATR multiple used when suggesting stops.
  default_atr_multiple: 2.0
  # Pre-trade gate (read-only checklist): below this reward/risk -> warning.
  rr_min: 1.5
  # Pre-trade gate: warn if a HIGH-impact event falls within this many hours.
  event_warn_hours: 48

  # --- Discipline gate (all read-only warnings, never orders) ---------
  # Budget caps: max committed RISK (currency, base_currency) per window. A new
  # trade that would push a window over its cap raises a warning (or blocks, if
  # that window's mode is 'block'). Paper positions are shown but counted apart.
  budget_day: 100
  budget_week: 175
  budget_month: 300
  budget_day_mode: warn        # warn | block
  budget_week_mode: warn
  budget_month_mode: warn
  # Sizing that gives room: warn if the stop distance is tighter than this × ATR
  # (inside normal noise -> premature-stop risk).
  stop_atr_min_multiple: 1.5
  # Profit set-aside reminder (tracking only — no money moves): target per day.
  set_aside_per_day: 100

  # --- Kill-switch (pre-mortem: stop rules you set when lucid) ---------
  # Soft blocks in the gate (you can force them, but it's recorded). Real and
  # paper losing streaks are counted separately.
  killswitch_enabled: true
  max_consecutive_losses: 3     # after N losses in a row -> soft block
  cooldown_hours: 24            # no new trade SAME instrument+direction within X h of a stop (anti-revenge)

# --- Trading universe (watchlist) — brief §4 ------------------------
# `symbol` is the yfinance ticker. `sleeve` groups instruments
# (macro|equity|commodity|energy|gauge). `tradeable_on` is informational.
# `traded: false` marks display-only gauges (e.g. VIX) — never traded.
# asset_class: equity | etf | index | fx | commodity | crypto
# `contract_multiplier` (a.k.a. point value, optional, default 1.0): currency
#   value of a 1.0 price move per 1 unit/contract — set it for futures/CFD/FX
#   so the M6 sizing/P&L math is correct (e.g. a future where $1 move = $50).
universe:
  # Macro core
  - symbol: "^NDX"          # Nasdaq 100 / "US Tech 100"
    name: "Nasdaq 100"
    asset_class: index
    sleeve: macro
    tradeable_on: "Fineco (CFD/futures, KO options)"
    contract_multiplier: 20       # E-mini Nasdaq-100: $20 per index point. Confirm for your broker/CFD.
  - symbol: "GC=F"          # Gold (XAU/USD)
    name: "Gold"
    asset_class: commodity
    sleeve: macro
    tradeable_on: "Fineco (CFD/futures, KO options)"
    contract_multiplier: 100      # COMEX gold: $100 per $1 move (100 oz). Confirm for your broker/CFD.
  - symbol: "EURUSD=X"
    name: "EUR/USD"
    asset_class: fx
    sleeve: macro
    tradeable_on: "Fineco (CFD)"
  # FX crosses for the REAL PORTFOLIO valuation (native→EUR). Not traded — quote =
  # units of the foreign currency per 1 EUR (EURGBP=X → GBP per EUR, etc.). Ingested
  # by the price job like any symbol; the portfolio converts native value / rate.
  - { symbol: "EURGBP=X", name: "EUR/GBP", asset_class: fx, sleeve: gauge, traded: false, tradeable_on: "solo valorizzazione" }
  - { symbol: "EURCHF=X", name: "EUR/CHF", asset_class: fx, sleeve: gauge, traded: false, tradeable_on: "solo valorizzazione" }
  - { symbol: "EURDKK=X", name: "EUR/DKK", asset_class: fx, sleeve: gauge, traded: false, tradeable_on: "solo valorizzazione" }
  - { symbol: "EURJPY=X", name: "EUR/JPY", asset_class: fx, sleeve: gauge, traded: false, tradeable_on: "solo valorizzazione" }
  - { symbol: "EURHKD=X", name: "EUR/HKD", asset_class: fx, sleeve: gauge, traded: false, tradeable_on: "solo valorizzazione" }
  # Equities (CEO tracciati). `themes` = tag tematici per l'avviso di
  # concentrazione (posizioni sullo stesso tema sono correlate, non diversificate).
  - symbol: "NVDA"
    name: "NVIDIA"
    asset_class: equity
    sleeve: equity
    themes: ["ai_datacenter"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "TSLA"
    name: "Tesla"
    asset_class: equity
    sleeve: equity
    themes: ["ev"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "GOOGL"
    name: "Alphabet"
    asset_class: equity
    sleeve: equity
    themes: ["ai_datacenter"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  # Book holdings — mega-cap AI/data-center + idiosincratici (NVO, SPGI)
  - symbol: "MSFT"
    name: "Microsoft"
    asset_class: equity
    sleeve: equity
    themes: ["ai_datacenter"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "AVGO"
    name: "Broadcom"
    asset_class: equity
    sleeve: equity
    themes: ["ai_datacenter", "semis"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "VRT"
    name: "Vertiv"
    asset_class: equity
    sleeve: equity
    themes: ["ai_datacenter"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "NVO"
    name: "Novo Nordisk ADR"
    asset_class: equity
    sleeve: equity
    themes: ["pharma"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  - symbol: "SPGI"
    name: "S&P Global"
    asset_class: equity
    sleeve: equity
    themes: ["financials"]
    tradeable_on: "CFD/equity; opzioni reali via IBKR"
  # China / commodities
  - symbol: "HG=F"
    name: "Copper"
    asset_class: commodity
    sleeve: commodity
    tradeable_on: "Fineco (CFD/futures, KO options)"
    contract_multiplier: 25000    # COMEX copper: $25,000 per $1/lb move (25,000 lb). Confirm for your broker/CFD.
  # Sessione europea (opzionale)
  - symbol: "^GDAXI"        # opzionale; in alt. ^STOXX50E (Euro Stoxx 50)
    name: "DAX 40"
    asset_class: index
    sleeve: macro
    tradeable_on: "Fineco (CFD/futures, KO options)"
    contract_multiplier: 25       # FDAX: €25 per index point. Confirm for your broker/CFD.
  # Energy — sleeve specialistico (vedi M5b)
  - symbol: "NG=F"
    name: "Natural Gas (Henry Hub)"
    asset_class: commodity
    sleeve: energy
    tradeable_on: "Fineco (CFD/futures, KO options)"
    contract_multiplier: 10000    # NYMEX Henry Hub: $10,000 per $1/MMBtu move (10,000 MMBtu). Confirm for your broker/CFD.
  # Gauge dashboard — NON tradato
  - symbol: "^VIX"
    name: "VIX"
    asset_class: index
    sleeve: gauge
    traded: false
    tradeable_on: "solo display"

# --- Holdings (currently owned; manual/CSV/Directa-synced later) -----
# These are NOT trade positions — they are long-term holdings to track.
# quantity/avg_price are entered by the user; the seed preserves any
# values already set and only refreshes metadata (it never zeroes them).
holdings:
  - { symbol: "GOOGL",   name: "Alphabet",         asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "MSFT",    name: "Microsoft",        asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "AVGO",    name: "Broadcom",         asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "VRT",     name: "Vertiv",           asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "NVO",     name: "Novo Nordisk ADR", asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "SPGI",    name: "S&P Global",       asset_class: equity,    quantity: 0, avg_price: null }
  - { symbol: "GC=F",    name: "Gold",             asset_class: commodity, quantity: 0, avg_price: null }
  - { symbol: "SI=F",    name: "Silver",           asset_class: commodity, quantity: 0, avg_price: null }  # point value 5000 if added to the trading universe (COMEX 5,000 oz)
  - { symbol: "HG=F",    name: "Copper",           asset_class: commodity, quantity: 0, avg_price: null }
  - { symbol: "BTC-USD", name: "Bitcoin",          asset_class: crypto,    quantity: 0, avg_price: null }

# --- Real portfolio (holdings) valuation ------------------------------
# Base currency for portfolio totals, and the EUR/<ccy> yfinance pair used to
# convert each native value to EUR. A currency with no pair here shows fx "n/d"
# (never an estimate). EUR needs no pair (rate = 1).
portfolio:
  base_currency: EUR
  eur_pairs:
    USD: "EURUSD=X"
    GBP: "EURGBP=X"
    CHF: "EURCHF=X"
    DKK: "EURDKK=X"
    JPY: "EURJPY=X"
    HKD: "EURHKD=X"

# --- Ingestion scheduling (cron; overridable via env) ----------------
schedule:
  prices_cron: "*/15 * * * *"           # every 15 minutes
  calendar_cron: "0 6 * * *"            # daily at 06:00 local
  news_cron: "*/30 * * * *"             # news ingestion every 30 min
  tagging_cron: "*/30 * * * *"          # AI tagging every 30 min (after news)
  briefing_morning_cron: "30 6 * * *"   # morning briefing, once/day 06:30
  briefing_intraday_cron: "0 13,18 * * *"  # intraday updates ~twice/day
  figures_cron: "*/45 * * * *"          # key-figures ingestion (M4)
  impact_cron: "*/45 * * * *"           # AI impact mapping (after figures)
  options_cron: "0 23 * * *"            # options desk: once/day after US close (M5)
  alerts_cron: "*/10 * * * *"           # alert evaluation every 10 min (M8)
  macro_cron: "30 22 * * *"             # FRED macro series: once/day (M9)
  decision_cron: "0 0 * * *"            # decision board assembly: after macro/options (M9)
  fundamentals_cron: "0 8 * * 1"        # quarterly fundamentals history + tone: weekly Mon 08:00
  experiment_cron: "*/5 * * * *"        # event experiment: opens/closes paper at delays (every 5 min)
  prospects_cron: "20 0 * * *"          # multi-horizon prospects: once/day (distributions move slowly)

# --- Provider selection (swap implementations without code changes) --
providers:
  prices: yfinance        # PriceProvider implementation
  calendar: fmp           # CalendarProvider implementation (falls back to seeded)

# --- Economic calendar -----------------------------------------------
# FMP's free tier 403s on /economic_calendar (paid endpoint). When the primary
# provider fails or returns nothing, the calendar job falls back to these SEEDED
# recurring macro dates so "next catalyst" + the board's event-risk factor work.
# These are reference DATES (configurable, not hardcoded in code). FOMC/ECB are
# explicit known 2026 meeting dates (decision day); the rest are recurring rules.
calendar:
  seed:
    enabled: true
    events:
      - { title: "FOMC decision", category: macro, importance: high, country: US, time: "18:00", rule: explicit,
          dates: ["2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"] }
      - { title: "ECB rate decision", category: macro, importance: high, country: EU, time: "12:15", rule: explicit,
          dates: ["2026-07-23", "2026-09-10", "2026-10-29", "2026-12-17"] }
      - { title: "US CPI (inflazione)", category: economic, importance: high, country: US, time: "12:30", rule: day_of_month, day: 12 }
      - { title: "US PCE (inflazione Fed)", category: economic, importance: high, country: US, time: "12:30", rule: last_business_day }
      - { title: "US Nonfarm Payrolls", category: economic, importance: high, country: US, time: "12:30", rule: nth_weekday, n: 1, weekday: 4 }
      - { title: "China PMI (NBS)", category: economic, importance: medium, country: CN, time: "01:00", rule: day_of_month, day: 30 }
      - { title: "Eurozona PMI flash", category: economic, importance: medium, country: EU, time: "08:00", rule: day_of_month, day: 23 }
      - { title: "IFO Germania (clima imprese)", category: economic, importance: medium, country: DE, time: "08:00", rule: day_of_month, day: 25 }
      - { title: "Eurozona CPI flash", category: economic, importance: high, country: EU, time: "09:00", rule: day_of_month, day: 1 }

# --- Price history / indicators --------------------------------------
indicators:
  history_days: 250        # lookback pulled for MA/ATR computation
  ma_periods: [20, 50, 200]
  atr_period: 14

# --- AI layer (Phase 2 / M3) -----------------------------------------
# Claude is called SERVER-SIDE ONLY; the API key lives in the worker .env
# (ANTHROPIC_API_KEY), never in the browser. Models are configurable.
# Honesty rule (CLAUDE.md §5): briefings must flag uncertainty and never
# present predictions as certainties — enforced in the system prompts.
ai:
  enabled: true
  # Briefings: a capable current Claude model.
  briefing_model: claude-sonnet-4-6
  # High-volume per-item tagging: a cheaper model (cost control).
  tagging_model: claude-haiku-4-5-20251001
  # High-volume per-statement impact mapping (M4): defaults to the tagging
  # model unless overridden here / via ANTHROPIC_FIGURES_MODEL.
  figures_model: claude-haiku-4-5-20251001
  # Journal review (M7): quality over volume -> a capable model. On demand only.
  journal_review_model: claude-sonnet-4-6
  journal_review_max_tokens: 1200
  journal_review_max_entries: 200   # cap entries fed to the review (cost guard)
  # Cost guardrails.
  tagging_max_items: 40        # max news items tagged per run
  tagging_max_tokens: 400
  briefing_max_tokens: 1200
  briefing_lookback_hours: 24  # how much recent news feeds a briefing
  notable_move_pct: 1.5        # |daily %| above this counts as a notable move
  figures_max_items: 30        # max key-figure statements impact-mapped per run
  figures_max_tokens: 400

# --- Themes tracked by the AI layer (configurable) -------------------
themes:
  - Fed
  - EU
  - China
  - Trump/tariffs
  - NVDA
  - Google
  - Musk

# --- News providers (each behind the NewsProvider interface) ---------
# GDELT is free/no-key; RSS feeds are configurable; NewsAPI is optional.
news:
  # Keyword set used to filter/limit ingested items to what's relevant to
  # the universe + themes (cost control before AI tagging). Configurable.
  keywords:
    - Fed
    - Powell
    - ECB
    - inflation
    - tariffs
    - China
    - Nvidia
    - Tesla
    - Google
    - gold
    - "natural gas"
  gdelt:
    enabled: true
    timespan: "1d"        # GDELT lookback window
    max_records: 60
  rss:
    enabled: true
    feeds:
      - { name: "Reuters Business", url: "https://news.google.com/rss/search?q=when:1d+allinurl:reuters.com&hl=en-US&gl=US&ceid=US:en" }
      - { name: "Federal Reserve", url: "https://www.federalreserve.gov/feeds/press_all.xml" }
      - { name: "ECB Press", url: "https://www.ecb.europa.eu/press/rss/press.xml" }
  newsapi:
    enabled: false         # optional; requires NEWSAPI_KEY in .env
  # Key-figure sourcing filter (M9 fix): require the figure's name in the title
  # and bias the query to actual statements, so institution news (obituaries,
  # stress tests, other officials) stops landing under a person's name.
  figures_filter:
    require_name_in_title: true
    statement_cues: ["said", "says", "statement", "remarks", "speech", "testimony", "comments", "warns", "signals", "tells", "told", "reiterates"]
    drop_terms: ["obituary", "dies", "died", "death", "funeral", "necrolog", "passes away", "passed away", "rugby", "st helens", "warrington", "super league"]
    # Default DOMAIN context: a surname-only match (e.g. "Powell") is kept only if
    # the title also names the figure's domain — kills homonyms (rugby/UK politics).
    context_terms: ["fed", "fomc", "federal reserve", "rate", "rates", "interest", "inflation", "monetary", "central bank", "markets", "stocks", "economy", "tariff", "trade", "white house", "earnings", "ceo", "shares"]

# --- Key figures tracker (M4) ----------------------------------------
# People/institutions whose statements may move the universe. For each,
# `keywords` drives the per-figure news query; `press_rss` (optional) adds
# an official feed. Fully configurable — add/remove figures freely.
# `match_terms` (optional): the terms that must appear in a headline for it to
# count as THIS figure's statement (defaults to the name + surname). For an
# institution, list the names/bodies that identify it.
figures:
  - name: "Donald Trump"
    role: "US President"
    keywords: ["Trump", "tariffs", "White House"]
    match_terms: ["Donald Trump", "Trump"]
    context_terms: ["tariff", "tariffs", "trade", "white house", "president", "fed", "economy", "markets", "china"]
  - name: "Jerome Powell"
    role: "Fed Chair"
    keywords: ["Jerome Powell", "Powell", "Federal Reserve", "FOMC"]
    match_terms: ["Jerome Powell", "Powell"]
    context_terms: ["fed", "fomc", "federal reserve", "rate", "rates", "interest", "inflation", "monetary", "central bank"]
    press_rss: "https://www.federalreserve.gov/feeds/press_all.xml"
  - name: "Elon Musk"
    role: "Tesla / xAI CEO"
    keywords: ["Elon Musk", "Tesla"]
    match_terms: ["Elon Musk", "Musk"]
    context_terms: ["tesla", "spacex", "xai", "twitter", " x ", "ev", "robotaxi"]
  - name: "Jensen Huang"
    role: "NVIDIA CEO"
    keywords: ["Jensen Huang", "Nvidia"]
    match_terms: ["Jensen Huang", "Huang"]
    context_terms: ["nvidia", "ai", "chip", "chips", "gpu", "data center", "semiconductor"]
  - name: "Sundar Pichai"
    role: "Alphabet CEO"
    keywords: ["Sundar Pichai", "Google", "Alphabet"]
    match_terms: ["Sundar Pichai", "Pichai"]
    context_terms: ["google", "alphabet", "ai", "gemini", "search", "antitrust"]
  - name: "Satya Nadella"
    role: "Microsoft CEO"
    keywords: ["Satya Nadella", "Microsoft", "Azure"]
    match_terms: ["Satya Nadella", "Nadella"]
    context_terms: ["microsoft", "azure", "ai", "copilot", "openai", "cloud", "capex", "data center"]
  - name: "Hock Tan"
    role: "Broadcom CEO"
    keywords: ["Hock Tan", "Broadcom"]
    match_terms: ["Hock Tan"]
    context_terms: ["broadcom", "ai", "networking", "semiconductor", "chip", "chips", "vmware", "custom silicon"]
  - name: "China policy"
    role: "PBoC / State Council"
    keywords: ["China policy", "PBoC", "Politburo", "State Council"]
    match_terms: ["PBoC", "Politburo", "State Council", "China policy"]

# --- Options / insurance desk (M5) -----------------------------------
# Analysis only — PROPOSES hedges/structures, never sends orders.
# yfinance serves options for US equities/ETFs only; macro underlyings use
# the proxy ETFs below. Underlyings without options (FX/crypto/no-proxy
# index) degrade gracefully. IV/Greeks are RECALCULATED (Yahoo's IV is
# unreliable).
options:
  provider: yfinance
  risk_free_rate: 0.04        # annual, decimal — used by BS/IV/Greeks
  expiries_count: 3           # how many near expiries to fetch per underlying
  strikes_window_pct: 0.15    # keep strikes within ±15% of spot (table size)
  hedge:
    put_otm_pct: 0.05         # protective put strike ~5% OTM
    call_otm_pct: 0.05        # collar short-call strike ~5% OTM
    min_days: 30              # first expiry at least this many days out
  # Macro exposures -> US-listed proxy ETF that HAS options on yfinance.
  # Symbols not listed here and without their own options are skipped.
  macro_proxies:
    "^NDX": QQQ
    "GC=F": GLD
    "SI=F": SLV
    "HG=F": CPER
    "NG=F": UNG

# --- Event experiment (controlled macro-event study) -----------------
# Opens HYPOTHETICAL (paper) positions at several delays after key US data
# releases, both directions, to MEASURE what happens — NEVER an order, never a
# signal. Flagged experiment=true, separate from real positions AND from your own
# manual paper positions. Volume note: entries = |instruments| × |delays| ×
# |horizons| × |directions| per event (defaults -> 3×4×3×2 = 72 paper rows/event);
# trim the lists or set enabled:false to reduce.
# --- Multi-horizon prospects (distributions, not forecasts) ----------
# Options (risk-neutral, BL) up to ~1y + conditional historical (all horizons,
# effective-n) + valuation (3/5y). Calibration verifies coverage/reliability.
prospects:
  enabled: true
  history_days: 5475            # ~15y for the conditional/valuation layers
  min_effective: 5              # min EFFECTIVE (overlap-corrected) n to show a distribution
  calibration_warmup: 500       # bars of history before retrospective coverage starts
  # Plausibility ceiling on |median return| per horizon: a risk-neutral median is
  # ≈ the forward (~0), so a larger value flags a unit bug (proxy≠instrument) and
  # the value is refused rather than shown.
  sanity_max_median: { "1s": 0.30, "1m": 0.60, "3m": 1.00, "6m": 1.50, "1a": 2.0 }

# --- Event experiment (controlled macro-event study) -----------------
experiment:
  enabled: true
  # Key US macro releases to track (matched against event titles).
  event_keywords: ["Nonfarm Payrolls", "Unemployment", "CPI", "PCE", "FOMC",
                   "rate decision", "Interest Rate", "FOMC Minutes", "Powell"]
  # Instruments to open paper positions on (must be in the universe).
  instruments: ["GC=F", "EURUSD=X", "^NDX"]
  # Entry delays after the release (minutes): t+5m, t+30m, t+2h, t+1d.
  delays_min: [5, 30, 120, 1440]
  # Exit horizons: end-of-day, +3 trading days, +5 trading days.
  horizons: ["eod", "3d", "5d"]
  directions: ["long", "short"]     # both, so no directional bias is baked in
  entry_grace_min: 20               # open if within this window past the target time
  lookback_days: 3                  # how far back to look for just-released events
  spread_bps: 5                     # informational spread/slippage estimate (not modelled)

# --- Alerts (M8) — NOTIFY only, never execute ------------------------
# Telegram token/chat live in the worker .env (server-side). Email is a
# prepared interface, OFF. Anti-spam: edge-triggered + cooldown.
alerts:
  channels:
    telegram: true
    email: false             # prepared but not wired
  cooldown_seconds: 3600     # default per-rule re-fire cooldown
  iv_spike_threshold: 0.6    # standing iv_spike: ATM IV at/above this (snapshot)
  # Standing categories (seeded as toggleable rules; defaults below).
  standing:
    risk: true               # risk-limit / stop-hit flags (from M6)
    deadline: true           # deadline approaching
    key_figure: true         # new key-figure statements
    universe_news: true      # news tagged to a universe instrument
    iv_spike: false          # elevated ATM IV (snapshot heuristic)

# --- Research / backtesting bench ------------------------------------
# READ-ONLY research to MEASURE if a rule has edge — NOT a signal generator.
# Built to make overfitting VISIBLE: NET results (costs+slippage always
# deducted), out-of-sample in primo piano, multi-strumento, e correzione per
# test multipli (Sharpe deflazionato). Tutto configurabile.
backtest:
  history_days: 5475          # ~15y of daily history pulled (cached locally)
  cache_max_age_hours: 24
  periods_per_year: 252
  cost_bps: 5.0               # commission + spread + slippage PER SIDE (basis points)
  is_fraction: 0.6            # 60% in-sample, 40% out-of-sample
  bootstrap_iter: 1000
  bootstrap_block: 5          # moving-block bootstrap block length (serial dependence)
  seed: 12345                 # reproducible bootstrap
  max_trials: 200             # cap on scan trials (logged if exceeded)
  # Tradable universe for scans (VIX gauge excluded — never traded).
  scan_universe: ["GC=F", "^NDX", "NVDA", "TSLA", "GOOGL", "HG=F", "NG=F", "^GDAXI", "EURUSD=X"]
  # Rule defaults (single run) + scan grids (parameter sweep -> N trials).
  rules:
    streak_reversion:
      params: { down_days: 5, hold_days: 3 }
      grid: { down_days: [3, 4, 5, 6, 7], hold_days: [1, 3, 5, 10] }
    ma_crossover:
      params: { fast: 50, slow: 200 }
      grid: { fast: [20, 50], slow: [100, 200], trend_ma: [~, 200] }
    rsi_reversion:
      params: { period: 14, buy_below: 30, exit_above: 55 }
      grid: { period: [7, 14], buy_below: [20, 30], exit_above: [50, 55, 70] }
    donchian_breakout:
      params: { n: 20 }
      grid: { n: [10, 20, 55] }
    bollinger_reversion:
      params: { period: 20, k: 2.0 }
      grid: { period: [20], k: [1.5, 2.0, 2.5] }

# --- Decision board (M9) — per-instrument confluence cockpit ---------
# NOT a signal and NEVER a prediction (CLAUDE.md §1, §5): it assembles the
# context the user weighs (macro drivers, technicals, an HONEST historical base
# rate with sample size n, and option-IMPLIED market odds). Implemented first
# for gold only; generalises to any instrument by adding an entry below.
#
# `macro_drivers` is the ONE new feed (FRED, free, key in worker .env as
# FRED_API_KEY). `supportive_when` only colours a driver as tail/head-wind
# (descriptive context, not a buy/sell call); `interpretation` is the tooltip.
# Series ids verified against FRED at build time (all daily):
#   DFII10   = 10y Treasury real yield (inflation-indexed, constant maturity)
#   T10YIE   = 10y breakeven inflation rate
#   DTWEXBGS = Nominal Broad U.S. Dollar Index
decision_board:
  enabled: true
  macro:
    provider: fred
    # Pull the FULL FRED history (~15y): the calibration needs many macro regimes,
    # not one — a short window makes any macro "edge" a likely regime artefact.
    # FRED series go back decades; the board's regime percentile uses `lookback_days`.
    history_days: 5475         # ~15y of FRED history pulled per series
    # Level/regime classification: a driver's STATE considers where its level
    # sits in its own history (percentile over `lookback_days`), not just the
    # daily move — so a high-but-falling real yield stays a structural headwind.
    regime:
      lookback_days: 252       # ~1Y of observations for the percentile
      high_pct: 0.66           # level at/above this percentile = "high" regime
      low_pct: 0.34            # level at/below this percentile = "low" regime
      use_regime: true         # false = classify by daily direction only (legacy)
    # A driver whose last FRED observation is older than this many BUSINESS days
    # vs "today" is flagged "dato ritardato" (FRED publishes with a lag; a recent
    # event may not be reflected yet). Honest: we never estimate a missing value.
    stale_after_business_days: 2
    # Derived series computed from FRED components and stored in macro_series like
    # any other (drivers reference them by id). EUR/USD's main driver is the
    # Fed–ECB policy-rate differential = Fed funds target upper (DFEDTARU) minus
    # ECB deposit facility rate (ECBDFR). Both verified daily FRED series.
    derived:
      - { id: "FED_ECB_SPREAD", op: subtract, left: "DFEDTARU", right: "ECBDFR" }
  # Structural event-risk banner: a HIGH-impact event for the instrument within
  # this many hours surfaces a fixed banner at the top of the board.
  event_risk_hours: 72
  # "Cosa ha mosso questo": how many days back to look for catalysts (news + just
  # -passed calendar events) that explain the RECENT move (never the next one).
  attribution_lookback_days: 5
  # Ciclicità (stagionalità): history pulled per instrument for month/weekday
  # seasonality. Several years needed; honest by construction (n + soglia + caveat).
  seasonality_history_days: 2600
  # Decision bench costs: estimated ROUND-TRIP trading cost per instrument, used
  # for the cost-adjusted break-even win rate. spread_bps = bps of notional;
  # commission = flat currency per trade. Override per instrument via `costs:`.
  costs_default: { spread_bps: 5, commission: 0 }
  base_rate:
    horizons: [1, 3, 5]        # trading days ahead for the historical distribution
    min_sample: 20             # below this n -> "campione insufficiente" (no conclusion)
  instruments:
    - symbol: "GC=F"
      name: "Gold"
      options_proxy: "GLD"     # yfinance options proxy for the implied probabilities
      # Dollar co-movement: gold is priced in USD -> inverse to the dollar. A
      # headline that moves the dollar tends to move gold AND EUR/USD together.
      dollar_sensitivity: inverse
      implied_horizons_days: [1, 3, 30]   # ~1 day / ~3 days / ~1 month
      # RSI band tuned for gold (a trending market keeps RSI stretched) — NOT 70/30.
      rsi: { period: 14, overbought: 80, oversold: 40 }
      range_window: 60         # position within the last N-day range
      round_step: 50           # gold round-number grid (psychological levels)
      figures: ["Jerome Powell"]
      event_keywords: ["FOMC", "Fed", "CPI", "PCE", "Powell", "payroll", "jobs", "inflation"]
      # `weight` feeds the synthesis "confluence read" lean (transparent scoring).
      macro_drivers:
        - { id: "DFII10",   label: "Tasso reale 10y",         source: fred,  supportive_when: falling, weight: 1.0, interpretation: "Tasso reale ↑ = vento contrario per l'oro (costo-opportunità più alto)." }
        - { id: "T10YIE",   label: "Breakeven inflazione 10y", source: fred,  supportive_when: rising,  weight: 0.5, interpretation: "Inflazione attesa ↑ = supporto storico per l'oro." }
        - { id: "DTWEXBGS", label: "Dollaro (broad)",         source: fred,  supportive_when: falling, weight: 1.0, interpretation: "Dollaro ↑ = vento contrario per l'oro (prezzato in USD)." }
        - { id: "^VIX",     label: "VIX",                     source: price, supportive_when: rising,  weight: 0.4, interpretation: "VIX ↑ = clima risk-off, storicamente favorevole all'oro." }
        # US debt (slow drivers) — MEASURED, not assumed. weight 0 = context: entra
        # nella calibrazione come ogni fattore; se ha IC → nel combinato col suo peso,
        # altrimenti resta contesto (dichiarato nel pannello ⓘ).
        - { id: "GFDEGDQ188S",        label: "Debito federale/PIL",       source: fred, supportive_when: rising, weight: 0.0, interpretation: "Debito/PIL USA. Driver LENTO: atteso senza valore predittivo a 1-6 mesi; rilevante come tesi di lungo periodo per l'oro." }
        - { id: "A091RC1Q027SBEA",    label: "Interessi sul debito USA",  source: fred, supportive_when: rising, weight: 0.0, interpretation: "Interessi pagati sul debito federale. Driver LENTO: contesto strutturale, non un segnale a breve." }
        - { id: "FYFSD",              label: "Deficit federale (annuo)",  source: fred, supportive_when: falling, weight: 0.0, interpretation: "Surplus/deficit federale. Driver LENTO: contesto di lungo periodo, atteso senza valore a 1-6 mesi." }
      # Synthesis weights for NON-macro factors. The lean is the alignment of
      # CURRENT conditions, NOT a probability/forecast. Context factors
      # (streak/atr/event) never feed the lean regardless of weight; rsi is a
      # mean-reversion stretch read, off by default (0).
      synthesis:
        weights:
          trend_ma: 1.0          # prezzo vs MA200 (in salita) / MA50 (in discesa)
          rsi: 0.0               # stiramento — contesto, escluso dal lean di default
    # --- EUR/USD: driver diversi dall'oro; il principale è il differenziale Fed-BCE.
    - symbol: "EURUSD=X"
      name: "EUR/USD"
      options_proxy: "FXE"       # ETF euro USA con opzioni (liquidità sottile -> prob. implicite da leggere con cautela)
      dollar_sensitivity: inverse   # EUR/USD sale quando il dollaro scende (co-muove con l'oro)
      implied_horizons_days: [1, 3, 30]
      rsi: { period: 14, overbought: 70, oversold: 30 }   # STANDARD (EUR/USD poco volatile), non 80/40 dell'oro
      range_window: 60
      round_step: 0.05           # numeri tondi FX (1.05 / 1.10 / 1.15 / 1.20)
      figures: ["Jerome Powell"]
      event_keywords: ["FOMC", "Fed", "ECB", "Lagarde", "CPI", "PCE", "Powell", "payroll", "inflation"]
      macro_drivers:
        - { id: "FED_ECB_SPREAD", label: "Differenziale tassi Fed-BCE", source: fred,  supportive_when: falling, weight: 1.5, interpretation: "Differenziale Fed-BCE che si stringe (↓) = supporto per EUR/USD. Driver principale." }
        - { id: "DGS2",     label: "Tasso 2y USA",          source: fred,  supportive_when: falling, weight: 0.8, interpretation: "Tasso 2y USA ↓ = meno carry sul dollaro = supporto per EUR." }
        - { id: "DFII10",   label: "Tasso reale 10y USA",   source: fred,  supportive_when: falling, weight: 0.6, interpretation: "Tasso reale USA ↓ = dollaro meno attraente." }
        - { id: "DTWEXBGS", label: "Dollaro (broad)",       source: fred,  supportive_when: falling, weight: 0.3, interpretation: "Dollaro ↓ = EUR/USD ↑ (peso basso: parzialmente circolare)." }
        - { id: "^VIX",     label: "VIX",                   source: price, supportive_when: falling, weight: 0.2, interpretation: "VIX ↑ = risk-off → dollaro rifugio → EUR giù (contesto, peso basso)." }
      synthesis:
        weights:
          trend_ma: 1.0
          rsi: 0.0
          skew: 0.5            # lean da risk reversal (solo se smile affidabile)
          cot: 0.5            # posizionamento COT, contrarian solo agli estremi
      # --- FX desk signals (skew/RR, expected move, event behaviour, COT) ---
      fx_signals: true
      fx:
        rr_horizons_days: [1, 7, 30]   # ~1g / 1 settimana / 1 mese
        history_days: 3650             # ~10y per il comportamento storico sugli eventi
        event_follow_days: 3           # persistenza vs inversione nei giorni dopo
        event_min_sample: 20           # sotto questo n -> "campione insufficiente"
      positioning:
        provider: cftc                 # COT (CFTC TFF, Leveraged Funds)
        market: "EURO FX"              # CME Euro FX contract (6E)
        lookback_weeks: 156            # ~3 anni per il percentile
    # --- Nasdaq-100: driver di tasso/duration; tesi via news/key-figure, non una serie macro.
    - symbol: "^NDX"
      name: "Nasdaq 100"
      options_proxy: "QQQ"           # opzioni molto liquide -> skew di alta qualità
      implied_horizons_days: [1, 3, 30]
      rsi: { period: 14, overbought: 70, oversold: 30 }   # standard
      range_window: 60
      round_step: 500                # numeri tondi a livello indice (~22-25k)
      figures: ["Jensen Huang", "Sundar Pichai", "Elon Musk"]
      event_keywords: ["FOMC", "Fed", "CPI", "PCE", "Powell", "payroll", "inflation", "earnings", "Nvidia", "utili"]
      # Niente doppio conteggio fra serie di tasso: si usa SOLO il reale 10y ad alto peso.
      macro_drivers:
        - { id: "DFII10",       label: "Tasso reale 10y",        source: fred,  supportive_when: falling, weight: 1.5, interpretation: "Tasso reale ↓ = sconto più basso sugli utili futuri = supporto per i tech a lunga duration (driver di valutazione principale)." }
        - { id: "BAMLH0A0HYM2", label: "Spread High Yield",      source: fred,  supportive_when: falling, weight: 0.8, interpretation: "Spread HY ↓ = condizioni finanziarie più distese, risk-on = supporto." }
        - { id: "^VIX",         label: "VIX",                    source: price, supportive_when: falling, weight: 0.6, interpretation: "VIX ↓ = risk-on (sopra ~25 = stress, vento contrario)." }
        - { id: "DTWEXBGS",     label: "Dollaro (broad)",        source: fred,  supportive_when: falling, weight: 0.3, interpretation: "Dollaro ↓ = condizioni globali più distese (contesto, peso basso)." }
      synthesis:
        weights:
          trend_ma: 1.0
          rsi: 0.0
          skew: 0.5            # QQQ skew di alta qualità -> lean affidabile
          cot: 0.0            # per gli indici azionari il COT è debole: solo contesto, non pesa nel lean
      fx_signals: true
      fx:
        rr_horizons_days: [1, 7, 30]
        history_days: 3650             # ~10y per il comportamento storico sugli eventi
        event_follow_days: 3
        event_min_sample: 20
      positioning:
        provider: cftc
        market: "NASDAQ MINI"          # E-mini Nasdaq-100 (NQ) nel report TFF
        lookback_weeks: 156
        note: "Per gli indici azionari il COT è un segnale DEBOLE (contano più put/call ratio e flussi): qui è solo contesto. Lo skew QQQ è il read di posizionamento migliore."

