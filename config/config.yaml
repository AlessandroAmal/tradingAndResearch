    # =================================================================
    # MACRO INSTRUMENT — RAME (commodity). COT UTILE (managed money,
    # report disaggregated). Opzioni CPER SOTTILI -> skew/implicite a
    # bassa affidabilità (il motore lo marca da solo). Driver reale =
    # Cina/domanda industriale, che arriva da news/PMI, non da FRED.
    # =================================================================
    - symbol: "HG=F"
      name: "Rame"
      options_proxy: "CPER"          # opzioni sottili -> implicite/skew a bassa affidabilità
      # Pesi: il driver reale è la DOMANDA CINESE/industriale (PMI Cina) via news;
      # macro e COT contano, i "fondamentali" specifici = PMI Cina (non aziendali).
      sections: { macro: 2, technical: 2, news: 3, cyclicality: 2, fundamentals: 1 }
      fundamentals_note: "Per il rame i «fondamentali» sono la domanda fisica: PMI manifatturiero cinese, scorte LME, attività industriale — non un bilancio aziendale. Arrivano da news/dati macro, non da yfinance."
      implied_horizons_days: [1, 3, 30]
      rsi: { period: 14, overbought: 70, oversold: 30 }
      range_window: 60
      round_step: 0.1                # prezzo rame ~4-5 $/lb -> numeri tondi a 0.10
      figures: ["China policy"]
      event_keywords: ["PMI", "China", "Cina", "FOMC", "copper", "rame"]
      macro_drivers:
        - { id: "DTWEXBGS", label: "Dollaro (broad)",   source: fred,  supportive_when: falling, weight: 0.5, interpretation: "Dollaro ↓ = commodity in USD più sostenute (contesto inverso)." }
        - { id: "DFII10",   label: "Tasso reale 10y",   source: fred,  supportive_when: falling, weight: 0.3, interpretation: "Contesto macro (peso basso). Il vero driver è la domanda cinese/industriale, via news/PMI." }
      synthesis:
        weights: { trend_ma: 1.0, rsi: 0.0, skew: 0.4, cot: 0.6 }   # COT utile sulle commodity
      fx_signals: true
      fx: { rr_horizons_days: [1, 7, 30], history_days: 3650, event_follow_days: 3, event_min_sample: 20 }
      positioning:
        provider: cftc
        report: disaggregated        # commodity -> Disaggregated / Managed Money
        market: "COPPER- #1"         # COMEX HG (verificato sui nomi reali CFTC)
        lookback_weeks: 156
        note: "Sulle commodity il COT (Managed Money) è utile: contrarian agli estremi."

    # =================================================================
    # MACRO INSTRUMENT — DAX (indice europeo). COT OFF (prodotto Eurex,
    # non riportato dalla CFTC). Proxy opzioni = ETF Germania USA-quotato
    # (EWG), APPROSSIMATO + opzioni sottili -> skew/implicite a bassa
    # affidabilità. Tecnica/base-rate da ^GDAXI (storia piena).
    # =================================================================
    - symbol: "^GDAXI"
